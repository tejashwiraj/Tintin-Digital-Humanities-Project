<!DOCTYPE html>
<html>

<head>

    <title>Tintin Map</title>

    <!-- Leaflet's map design -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>

        #map {
            height: 600px;
            width: 100%;
        }

    </style>

</head>

<body>

    <h1>Tintin's Travels</h1>

    <div id="map"></div>


    <!-- Leaflet's map functionality -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>

        // Create the map
        var map = L.map('map').setView([20, 20], 2);

        // Put the actual world map on it
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        L.marker([28.4, 84.1]).addTo(map)
        .bindPopup("<b>Tintin in Tibet</b>Year:1960<br>Location: Tibet/Himalayan region.")
        .openPopup();

        L.marker([41.8781, -87.6298]).addTo(map)
        .bindPopup("<b>Tintin in America</b>Year:1932<br>Location: Chicago, Lake City, Red Skin City.")
        .openPopup();

        L.marker([26.8206, 30.8025]).addTo(map)
        .bindPopup("<b>Cigars of the Pharaoh</b>Year:1934<br>Location: Egypt.")
        .openPopup();

       L.marker([31.2304, 121.4737]).addTo(map)
        .bindPopup("<b>The Blue Lotus</b>Year:1936<br>Location: Shanghai, China..")
        .openPopup();


    </script>

</body>

</html>
